---
# ServiceAccount used by both JobManager and TaskManager pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-service-account
  namespace: cicd-observability

---
# The Flink Kubernetes Operator needs these permissions to manage
# JobManager/TaskManager Deployments and Services on your behalf.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: cicd-observability
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps", "events", "persistentvolumeclaims"]
    verbs:     ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs:     ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinksessionjobs"]
    verbs:     ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: cicd-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:     Role
  name:     flink-role
subjects:
  - kind:      ServiceAccount
    name:      flink-service-account
    namespace: cicd-observability
