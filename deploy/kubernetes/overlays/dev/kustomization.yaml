apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherits all base resources
bases:
  - ../../base

# Override image tag for dev
images:
  - name:    your-registry/cicd-flink-analytics
    newName: localhost:5000/cicd-flink-analytics   # local registry
    newTag:  dev

# Patch: smaller resources + 1 TaskManager replica for dev
patches:
  - target:
      kind: Deployment
      name: flink-taskmanager
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1024Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1024Mi"

# Override ConfigMap values for dev (local Kafka)
configMapGenerator:
  - name: flink-job-config
    behavior: merge
    literals:
      - KAFKA_BOOTSTRAP=kafka:29092
      - FLINK_PARALLELISM=1
