---
# ── TaskManager Deployment ────────────────────────────────────────────────────
# TaskManagers:
#   - Execute the actual operator tasks (EventRouter, DORA operators,
#     HealthOperator, LateEventOperator, CEP FailurePatternOperator)
#   - Each TaskManager has N slots (configured via numberOfTaskSlots)
#   - Flink schedules operator parallelism across available slots
#
# With parallelism=2 and 4 slots per TaskManager, one TaskManager handles
# the full job.  Scale replicas up for higher event throughput.
#
# Operator assignment by the EventRouter means:
#   - DORA operators run on events tagged DORA_TAG only
#   - CEP NFA runs on events tagged CEP_TAG only (5 event types)
#   - Late event operator runs on late-candidate events only
#   Each TaskManager slot processes only what it's assigned.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: cicd-observability
  labels:
    app:       cicd-flink
    component: taskmanager
spec:
  replicas: 2   # Scale this up for higher throughput
  selector:
    matchLabels:
      app:       cicd-flink
      component: taskmanager
  template:
    metadata:
      labels:
        app:       cicd-flink
        component: taskmanager
    spec:
      serviceAccountName: flink-service-account
      containers:
        - name: taskmanager
          image: your-registry/cicd-flink-analytics:latest  # ← replace with your image
          imagePullPolicy: Always
          args: ["taskmanager"]

          ports:
            - containerPort: 6122   # Task RPC
              name: rpc
            - containerPort: 6125   # Query server
              name: query

          env:
            - name: FLINK_COMPONENT
              value: "taskmanager"
            # Point TaskManagers at the JobManager service
            - name: JOB_MANAGER_RPC_ADDRESS
              value: "flink-jobmanager"
            - name: JOB_MANAGER_RPC_PORT
              value: "6123"

          envFrom:
            - configMapRef:
                name: flink-job-config

          resources:
            requests:
              memory: "2048Mi"
              cpu:    "500m"
            limits:
              memory: "2048Mi"
              cpu:    "2000m"

          livenessProbe:
            tcpSocket:
              port: 6122
            initialDelaySeconds: 30
            periodSeconds:       15
            failureThreshold:    5

          # Volume for RocksDB state (local SSD preferred in production)
          volumeMounts:
            - name:      flink-state
              mountPath: /tmp/flink-checkpoints

      volumes:
        - name: flink-state
          emptyDir: {}  # Replace with PersistentVolumeClaim in production

---
# ── HorizontalPodAutoscaler for TaskManagers ──────────────────────────────────
# Scales TaskManager replicas based on CPU — more replicas = more task slots
# = higher event throughput from Kafka.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flink-taskmanager-hpa
  namespace: cicd-observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       flink-taskmanager
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
