---
# ── PostgreSQL ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cicd-observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB,       value: cicd_metrics }
            - { name: POSTGRES_USER,     value: flink }
            - { name: POSTGRES_PASSWORD, value: flink_secret }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flink", "-d", "cicd_metrics"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cicd-observability
spec:
  selector: { app: postgres }
  ports:
    - port: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: cicd-observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# ── Grafana ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cicd-observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - { name: GF_SECURITY_ADMIN_USER,     value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_AUTH_ANONYMOUS_ENABLED,  value: "true" }
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources/
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/
            - name: grafana-dashboards-json
              mountPath: /etc/grafana/provisioning/dashboards/json/
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasource
          configMap:
            name: grafana-datasource-config
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider-config
        - name: grafana-dashboards-json
          configMap:
            name: grafana-dashboards-config

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cicd-observability
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - port: 3000
      nodePort: 30300

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: cicd-observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
