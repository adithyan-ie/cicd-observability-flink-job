---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cicd-flink.fullname" . }}-jobmanager
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cicd-flink.labels" . | nindent 4 }}
    component: jobmanager
spec:
  replicas: {{ .Values.flink.jobmanager.replicas }}
  selector:
    matchLabels: {{- include "cicd-flink.selectorLabels" . | nindent 6 }}
      component: jobmanager
  template:
    metadata:
      labels: {{- include "cicd-flink.selectorLabels" . | nindent 8 }}
        component: jobmanager
    spec:
      serviceAccountName: {{ include "cicd-flink.fullname" . }}-sa
      containers:
        - name: jobmanager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["standalone-job"]
          ports:
            - containerPort: 6123
              name: rpc
            - containerPort: 6124
              name: blob
            - containerPort: 8081
              name: webui
          env:
            - name: FLINK_COMPONENT
              value: "jobmanager"
            - name: FLINK_JOB_CLASS
              value: "com.cicd.observability.jobs.PipelineObservabilityJob"
          envFrom:
            - configMapRef:
                name: {{ include "cicd-flink.fullname" . }}-config
          resources: {{- toYaml .Values.flink.jobmanager.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /overview, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds:       15
          readinessProbe:
            httpGet: { path: /overview, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds:       10

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cicd-flink.fullname" . }}-jobmanager
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cicd-flink.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cicd-flink.selectorLabels" . | nindent 4 }}
    component: jobmanager
  ports:
    - { name: rpc,   port: 6123 }
    - { name: blob,  port: 6124 }
    - { name: webui, port: 8081 }

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cicd-flink.fullname" . }}-webui
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "cicd-flink.selectorLabels" . | nindent 4 }}
    component: jobmanager
  ports:
    - name:       webui
      port:       8081
      targetPort: 8081
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
