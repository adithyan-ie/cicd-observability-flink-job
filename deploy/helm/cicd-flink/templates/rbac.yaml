---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cicd-flink.fullname" . }}-sa
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cicd-flink.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cicd-flink.fullname" . }}-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints"]
    verbs:     ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs:     ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cicd-flink.fullname" . }}-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:     ClusterRole
  name:     {{ include "cicd-flink.fullname" . }}-role
subjects:
  - kind:      ServiceAccount
    name:      {{ include "cicd-flink.fullname" . }}-sa
    namespace: {{ .Release.Namespace }}
