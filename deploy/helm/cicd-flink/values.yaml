# ── Helm chart values for cicd-flink ─────────────────────────────────────────
# Override any value with: helm install cicd-flink ./helm/cicd-flink -f my-values.yaml

image:
  repository: your-registry/cicd-flink-analytics
  tag:        latest
  pullPolicy: Always

# ── Kafka ──────────────────────────────────────────────────────────────────────
kafka:
  bootstrap:     kafka:29092
  topics:
    input:     cicd-events
  consumerGroup: flink-cicd-analytics

# ── Flink ──────────────────────────────────────────────────────────────────────
flink:
  parallelism: 2

  jobmanager:
    replicas: 1
    resources:
      requests: { memory: 1600Mi, cpu: 500m }
      limits:   { memory: 1600Mi, cpu: "1" }

  taskmanager:
    replicas: 2
    slotsPerTask: 4
    resources:
      requests: { memory: 2048Mi, cpu: 500m }
      limits:   { memory: 2048Mi, cpu: "2" }
    autoscaling:
      enabled:     true
      minReplicas: 1
      maxReplicas: 6
      cpuTarget:   70

# ── Watermark ──────────────────────────────────────────────────────────────────
watermark:
  delaySeconds: 30
  idleTimeoutSeconds: 60

# ── CEP ────────────────────────────────────────────────────────────────────────
cep:
  patternWindowMinutes: 10
  lateCandidateThresholdSeconds: 30

# ── Checkpointing ──────────────────────────────────────────────────────────────
checkpointing:
  intervalMs:  10000
  dir:         file:///tmp/flink-checkpoints
  stateBackend: rocksdb

# ── Service ────────────────────────────────────────────────────────────────────
service:
  type:     NodePort
  nodePort: 30081
